server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Each demo lives at /<slug>/. nginx's default static handler issues an
  # external 301 from /<slug> -> /<slug>/ so the sites' relative asset paths
  # (assets/hero.png) resolve correctly. Do NOT add a `location /` with
  # try_files here, or that external redirect becomes an internal rewrite and
  # relative assets break.

  location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
